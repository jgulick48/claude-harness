name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # tmux integration tests run on Linux/macOS; they skip where tmux is absent (Windows).
      - name: Install tmux (Linux)
        if: runner.os == 'Linux'
        run: command -v tmux || (sudo apt-get update && sudo apt-get install -y tmux)

      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        run: command -v tmux || brew install tmux

      # macOS and Windows file systems are case-insensitive: two paths that
      # differ only in case break the build there but not on Linux.
      - name: Check for case-colliding file names
        if: runner.os == 'Linux'
        run: |
          dups="$(git ls-files | sort -f | uniq -di)"
          if [ -n "$dups" ]; then
            echo "These paths collide on case-insensitive file systems:"
            echo "$dups"
            exit 1
          fi

      - name: Check gofmt
        if: runner.os == 'Linux'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

      - name: Build harness-core
        run: |
          EXT=""
          if [ "$RUNNER_OS" = "Windows" ]; then EXT=.exe; fi
          mkdir -p bin
          go build -o "bin/harness-core${EXT}" ./cmd/harness-core

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: UI typecheck
        working-directory: ui
        run: npm run typecheck

      - name: UI tests
        working-directory: ui
        run: npm test

      # Browser end-to-end tests (Linux and macOS; Windows has no tmux).
      - name: Install Playwright Chromium (Linux)
        if: runner.os == 'Linux'
        working-directory: ui
        run: npx playwright install --with-deps chromium

      - name: Install Playwright Chromium (macOS)
        if: runner.os == 'macOS'
        working-directory: ui
        run: npx playwright install chromium

      - name: Build sshtestd (e2e SSH host)
        if: runner.os != 'Windows'
        run: go build -o bin/sshtestd ./internal/sshconn/sshtest/cmd/sshtestd

      - name: E2E renderer tests
        if: runner.os != 'Windows'
        working-directory: ui
        run: npm run test:e2e:renderer

      - name: E2E electron tests (Linux, under Xvfb)
        if: runner.os == 'Linux'
        working-directory: ui
        run: xvfb-run -a npm run test:e2e:electron

      - name: E2E electron tests (macOS)
        if: runner.os == 'macOS'
        working-directory: ui
        run: npm run test:e2e:electron

      - name: Upload e2e screenshots and report
        if: always() && runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.os }}
          path: |
            ui/e2e/screenshots
            ui/e2e/playwright-report
            ui/e2e/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Package UI (unsigned)
        working-directory: ui
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run package

      - name: Upload UI artifact
        uses: actions/upload-artifact@v4
        with:
          name: claude-harness-${{ matrix.os }}
          path: ui/dist/
          if-no-files-found: warn
          retention-days: 7
