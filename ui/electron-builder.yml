appId: com.jgulick48.claudeharness
productName: Claude Harness
directories:
  output: dist
files:
  - out/**/*
  - package.json
  - "!src/**"
  - "!**/*.test.ts"
extraResources:
  - from: ../bin
    to: bin
    filter:
      - harness-core
      - harness-core.exe
artifactName: claude-harness-${version}-${os}-${arch}.${ext}
mac:
  # Signing and notarization are switched on from the release workflow only
  # when the signing secrets exist (see docs/SIGNING.md); without them none of
  # this takes effect and the build stays unsigned.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
win:
  target:
    - target: nsis
      arch: [x64]
linux:
  target:
    - target: AppImage
      arch: [x64]
  category: Development
publish:
  provider: github
  owner: jgulick48
  repo: claude-harness
  releaseType: draft
